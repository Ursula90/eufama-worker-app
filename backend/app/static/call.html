<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EUFAMA Connect — Apel</title>
<style>
  :root {
    --bg: #05070f;
    --panel: #0f1420;
    --cyan: #00b3ff;
    --dim: #7f8fae;
    --red: #d81b3d;
    --green: #00b36b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: #e6ecf5;
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  #status-bar {
    padding: 10px 16px; font-size: 13px; color: var(--dim);
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #161c2b;
  }
  #status-bar .brand { color: var(--cyan); font-weight: 700; letter-spacing: .5px; }

  #stage {
    flex: 1; display: grid; gap: 8px; padding: 10px;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    align-content: center;
    overflow-y: auto;
  }
  .tile {
    position: relative; background: var(--panel); border-radius: 14px;
    overflow: hidden; aspect-ratio: 4/3; display: flex;
    align-items: center; justify-content: center; border: 1px solid #1c2436;
  }
  .tile video { width: 100%; height: 100%; object-fit: cover; }
  .tile .label {
    position: absolute; left: 8px; bottom: 8px; font-size: 12px;
    background: rgba(0,0,0,.5); padding: 3px 8px; border-radius: 8px;
  }
  .avatar-circle {
    width: 72px; height: 72px; border-radius: 50%; background: #142033;
    color: var(--cyan); display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; border: 2px solid var(--cyan);
  }
  .audio-pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0,179,255,.5); }
    50% { box-shadow: 0 0 0 14px rgba(0,179,255,0); }
  }

  #local-preview {
    position: absolute; right: 14px; bottom: 96px; width: 96px; height: 128px;
    border-radius: 12px; overflow: hidden; border: 2px solid var(--cyan);
    background: var(--panel); z-index: 5;
  }
  #local-preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

  #controls {
    display: flex; justify-content: center; gap: 18px; padding: 18px;
    border-top: 1px solid #161c2b;
  }
  .ctl-btn {
    width: 58px; height: 58px; border-radius: 50%; border: none; cursor: pointer;
    background: #182236; color: #fff; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .ctl-btn.off { background: #3a4560; }
  .ctl-btn.hangup { background: var(--red); width: 70px; height: 70px; font-size: 24px; }

  #center-msg {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; text-align: center; padding: 24px; color: var(--dim);
    font-size: 14px;
  }
  #center-msg.hidden { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="status-bar">
    <span class="brand">EUFAMA CONNECT</span>
    <span id="status-text">Se conectează…</span>
  </div>
  <div style="position:relative; flex:1;">
    <div id="stage"></div>
    <div id="local-preview" hidden><video id="local-video" autoplay playsinline muted></video></div>
    <div id="center-msg">Se conectează la apel…</div>
  </div>
  <div id="controls">
    <button class="ctl-btn" id="btn-mic" title="Microfon">🎤</button>
    <button class="ctl-btn" id="btn-cam" title="Cameră">🎥</button>
    <button class="ctl-btn hangup" id="btn-hangup" title="Închide">📞</button>
  </div>
</div>
<script src="call.js"></script>
</body>
</html>
